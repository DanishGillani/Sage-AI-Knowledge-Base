[project]
name = "sage-api"
version = "0.1.0"
description = "Sage — AI Knowledge Base, FastAPI RAG service"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Config & validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # LangChain orchestration
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-postgres>=0.0.12",
    "langchain-text-splitters>=0.3.0",

    # Vector store
    "pgvector>=0.3.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # Document processors
    "pdfplumber>=0.11.0",
    "pdf2image>=1.17.0",
    "Pillow>=11.0.0",
    "pytesseract>=0.3.10",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",

    # Audio/video
    "faster-whisper>=1.1.0",
    "opencv-python-headless>=4.10.0",

    # Utilities
    "python-multipart>=0.0.12",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
    "factory-boy>=3.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "ANN"]
ignore = [
    "N818",   # exception name should end in Error — AppException hierarchy uses Exception suffix intentionally
    "B008",   # do not perform function calls in argument defaults — required for FastAPI Depends()
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=78"

[tool.coverage.run]
omit = ["tests/*", "alembic/*", "app/main.py"]
