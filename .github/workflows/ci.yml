name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt into Node.js 24 runner for all actions (removes Node.js 20 deprecation warnings)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── TypeScript checks (all packages in parallel via Turborepo) ─────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sage/db run db:generate
      - run: pnpm turbo run typecheck

  # ── ESLint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sage/db run db:generate
      - run: pnpm turbo run lint

  # ── Python lint (Ruff) ────────────────────────────────────────────────────
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff lint
        working-directory: apps/api
        run: ruff check .
      - name: Ruff format check
        working-directory: apps/api
        run: ruff format --check .

  # ── TypeScript unit tests ─────────────────────────────────────────────────
  test-ts:
    name: Unit Tests (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sage/db run db:generate
      - run: pnpm turbo run test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ts-coverage
          path: apps/web/coverage/

  # ── Python unit tests ─────────────────────────────────────────────────────
  test-python:
    name: Unit Tests (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sage
          POSTGRES_PASSWORD: sage
          POSTGRES_DB: sage
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --extra dev
      - name: Run pytest
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://sage:sage@localhost:5432/sage
          AI_PROVIDER: ollama
          ENVIRONMENT: test
        run: uv run pytest --cov=app --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: apps/api/coverage.xml

  # ── E2E tests (Playwright) ────────────────────────────────────────────────
  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sage/db run db:generate
      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Start infrastructure
        run: docker compose up -d db
      - name: Wait for database
        run: |
          timeout 60 bash -c 'until docker compose ps db | grep -q "healthy"; do sleep 2; done'
      - name: Build Next.js for E2E
        working-directory: apps/web
        env:
          DATABASE_URL: postgresql://sage:sage@localhost:5432/sage
        run: pnpm build
      - name: Run E2E tests (Chromium only in CI)
        working-directory: apps/web
        env:
          DATABASE_URL: postgresql://sage:sage@localhost:5432/sage
        run: pnpm exec playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright/report/
